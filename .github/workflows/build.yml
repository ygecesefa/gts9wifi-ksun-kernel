name: Build gts9wifi kernel (KernelSU Next + SUSFS)

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: Add KernelSU Next (off = control build of the same pipeline)
        type: boolean
        default: true

env:
  KERNEL_REPO: samsung-sm8550-tab/android_kernel_samsung_sm8550
  KERNEL_SHA: 038b7c0528e25fea9849b56df821649abdea1b23   # Lineage 24.0 20261015 boot
  KERNEL_RELEASE: 5.15.208-g038b7c0528e2                 # must match vendor_dlkm modules
  KSUN_TAG: v3.4.2                                       # ships SUSFS (LKM) built in
  CLANG: clang-r596125                                   # same as Lineage's build
  LINEAGE_ZIP: https://github.com/samsung-sm8550-tab/releases/releases/download/lineage-24.0-20261015-UNOFFICIAL-gts9wifi/lineage-24.0-20261015-UNOFFICIAL-gts9wifi.zip
  LINEAGE_SHA256: 28bf1be6dca7014ad5576ae97d91998dc235a0783d7775d83c10f92c3b5dac04
  MAKE_ARGS: O=out ARCH=arm64 LLVM=1 LLVM_IAS=1

permissions:
  contents: write   # publish boot.img as a release (artifact storage quota is tiny)

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell
          docker image prune -af > /dev/null || true
          # Linking vmlinux needs more than the runner's 16 GB RAM, but the
          # link output is mmapped: a full disk shows up as "Bus error".
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h; df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio lz4 python3 zip unzip dwarves
          pahole --version

      - name: Fetch kernel source
        run: |
          git init -q kernel
          cd kernel
          git remote add origin https://github.com/$KERNEL_REPO
          git fetch -q --depth=1 origin $KERNEL_SHA
          git checkout -q FETCH_HEAD

      - name: Fetch toolchain
        run: |
          # Only this one toolchain dir; gitiles refuses archives this large.
          git clone -q --depth 1 --filter=blob:none --sparse \
            -b mirror-goog-main-llvm-toolchain-source \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 prebuilts
          git -C prebuilts sparse-checkout set $CLANG
          ln -s prebuilts/$CLANG clang
          clang/bin/clang --version

      - name: Add KernelSU Next
        if: ${{ inputs.ksu }}
        working-directory: kernel
        run: curl -fLSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/$KSUN_TAG/kernel/setup.sh | bash -s $KSUN_TAG

      - name: Configure
        working-directory: kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          # Keep the release string identical so vendor_dlkm modules load.
          echo "-g${KERNEL_SHA:0:12}" > .scmversion
          mkdir -p out
          cp ../config/lineage24.config out/.config
          if [ "${{ inputs.ksu }}" = true ]; then
            scripts/config --file out/.config -e KSU -e KPROBES -e KPROBE_EVENTS
          fi
          # Lineage's vendor_boot/vendor_dlkm/system_dlkm modules are signed with
          # Lineage's build key, which this build does not have. With
          # MODULE_SIG_PROTECT they count as unsigned and may not use/export the
          # protected GKI symbols, so the first boot looped. Allow them.
          scripts/config --file out/.config -d MODULE_SIG_PROTECT
          # Full LTO gets OOM-killed on hosted runners; thin LTO keeps the ABI.
          scripts/config --file out/.config -d LTO_CLANG_FULL -e LTO_CLANG_THIN
          make $MAKE_ARGS olddefconfig
          grep -E '^CONFIG_(KSU|LTO_CLANG|MODULE_SIG)' out/.config || true
          ! grep -q '^CONFIG_MODULE_SIG_PROTECT=y' out/.config
          rel=$(make -s $MAKE_ARGS kernelrelease)
          echo "kernelrelease: $rel"
          [ "$rel" = "$KERNEL_RELEASE" ]

      - name: Build Image
        working-directory: kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          make $MAKE_ARGS -j$(nproc) Image || { df -h /; free -h; exit 1; }
          strings out/arch/arm64/boot/Image | grep -m1 'Linux version 5'

      - name: Repack Lineage boot.img with the new kernel
        run: |
          curl -fsSL -o l24.zip "$LINEAGE_ZIP"
          echo "$LINEAGE_SHA256  l24.zip" | sha256sum -c
          unzip -p l24.zip boot.img > boot.lineage.img
          git clone -q --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg
          python3 mkbootimg/unpack_bootimg.py --boot_img boot.lineage.img --out unpacked --format=mkbootimg > args.txt
          cat args.txt
          cp kernel/out/arch/arm64/boot/Image unpacked/kernel
          eval python3 mkbootimg/mkbootimg.py $(cat args.txt) --output boot.img
          truncate -s $(stat -c %s boot.lineage.img) boot.img   # full partition, no stale AVB footer
          mkdir dist
          cp boot.img kernel/out/arch/arm64/boot/Image kernel/out/.config dist/
          strings dist/Image | grep -m1 'Linux version 5' > dist/version.txt
          grep -q "$KERNEL_RELEASE " dist/version.txt
          (cd dist && sha256sum boot.img Image > SHA256SUMS)
          cat dist/version.txt dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.ksu }}" = true ]; then v=ksun-$KSUN_TAG; else v=control-noksu; fi
          tag=$v-nosigprot-$(date -u +%Y%m%d-%H%M)
          gh release create "$tag" dist/* -R "$GITHUB_REPOSITORY" \
            --title "$tag" --notes "Lineage 24.0 kernel ($KERNEL_RELEASE), variant $v, MODULE_SIG_PROTECT off. $(cat dist/version.txt)"
